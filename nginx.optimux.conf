proxy_cache_path /tmp/shm/edge_cache levels=1:2 keys_zone=live_img_cache:10m inactive=60m max_size=960m;
error_log  /var/log/nginx/error.log error;


server {
        listen 443 ssl http2 reuseport;
        # server_name optimux.duckdns.org;
        server_name _;

        ssl_certificate /etc/ssl/certs/optimux-server.crt;
        ssl_certificate_key /etc/ssl/certs/optimux-server.key;

        # ssl_certificate /etc/letsencrypt/live/optimux.duckdns.org/fullchain.pem;
        # ssl_certificate_key /etc/letsencrypt/live/optimux.duckdns.org/privkey.pem;
        ssl_session_cache shared:SSL:10m; # 1mb can hold approx 4000 sess.
        keepalive_timeout 100s;


        location /resize {
                proxy_pass http://127.0.0.1:8811;
				proxy_ssl_protocols TLSv1.2 TLSv1.3;
                # proxy_ssl_verify off; # If using self-signed certs

                expires 60m;

                proxy_ignore_headers X-Accel-Expires Expires Cache-Control Set-Cookie;

                proxy_cache live_img_cache;
                proxy_cache_valid 200 302 60m;
                proxy_cache_valid 404 1m;
                proxy_cache_revalidate on;
                proxy_cache_min_uses   1;
                proxy_cache_use_stale error timeout updating;
                # proxy_cache_key "$scheme://$host$request_uri";

                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

                # proxy_set_header Upgrade $http_upgrade;
                # proxy_set_header Connection "Upgrade";
                proxy_set_header X-Forwarded-Proto https;
                add_header Cache-Control "public, max-age=600, immutable";
                add_header Vary "Accept-Encoding";

                add_header "Access-Control-Allow-Origin" "$host";
                add_header X-Cache-Status $upstream_cache_status;
                add_header X-XSS-Protection "1; mode=block";
                add_header X-Frame-Options SAMEORIGIN;
                add_header X-Content-Type-Options nosniff;
                # add_header ETag $request_filename; # to be set by golang server
                add_header Last-Modified $date_gmt;

                proxy_request_buffering on;
                proxy_buffering on;
                chunked_transfer_encoding on;

        }

        location ~ /\. {
                deny all;
                access_log /var/log/nginx/invalid_requests.log;

                return 404;
        }
}

