pcre_jit on;

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    log_format datadog '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      '$request_time $upstream_response_time';

    log_format datadog_json escape=json
      '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"remote_user":"$remote_user",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"http_host":"$http_host",'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status"'
      '}';

    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    sendfile_max_chunk 6m;
    keepalive_timeout  65s;

    proxy_cache_path /tmp/shm/edge_cache levels=1:2 keys_zone=live_img_cache:10m inactive=60m max_size=2048m; 

    access_log /var/log/nginx/access.log datadog;
    error_log  /var/log/nginx/error.log debug;

    upstream backend {
        server 127.0.0.1:8811;
    }

    map $http_origin $x_http_origin {
	    default $host;     # If Origin is blank, use $host
	    "~." $http_origin; # If Origin exists, use it
    }

    server {
        listen 81 reuseport backlog=1024;
        server_name _;

        location /nginx_status {
            stub_status;
            allow all;
        }
    }

    server {
        listen 80 reuseport backlog=4096;
        server_name _; 

        location /optimux {
                proxy_pass http://backend;
                expires 60m;

                proxy_ignore_headers X-Accel-Expires Expires Cache-Control Set-Cookie;

		# proxy_set_header Host $host;

		proxy_set_header Origin $x_http_origin;

                proxy_cache live_img_cache;
                proxy_cache_valid 200 302 60m;
                proxy_cache_valid 404 1m;
                proxy_cache_revalidate on;
                proxy_cache_min_uses   1;
                proxy_cache_use_stale error timeout updating;
                proxy_cache_key "$scheme://$host$request_uri";

                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

                proxy_set_header X-Forwarded-Proto https;
                add_header Cache-Control "public, max-age=600, immutable";
                add_header Vary "Accept-Encoding";

                # add_header "Access-Control-Allow-Origin" "$host";
                # add_header "Access-Control-Allow-Methods" "GET, POST, OPTIONS, PUT, DELETE";
                # add_header "Access-Control-Allow-Headers" "Authorization, Content-Type, X-Requested-With, X-CSRF-Token, Content-Disposition";
                # add_header "Access-Control-Expose-Headers" "Content-Disposition, Content-Length, X-Request-Id";
                # add_header "Access-Control-Allow-Credentials" "true";

                add_header X-Cache-Status $upstream_cache_status;
                add_header X-XSS-Protection "1; mode=block";
                add_header X-Frame-Options SAMEORIGIN;
                add_header X-Content-Type-Options nosniff;
                add_header Last-Modified $date_gmt;

                proxy_request_buffering on;
                proxy_buffering on;
                chunked_transfer_encoding on;
        }

        location ~ /\. {
            deny all;
            access_log /var/log/nginx/invalid_requests.log;

            return 404;
        }
    }
}
