pcre_jit on;

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    lua_package_path "/usr/local/share/lua/5.1/?.lua;/usr/local/share/lua/5.1/?/init.lua;/usr/local/share/lua/5.1/lualib/?.lua;/etc/nginx/lua/?.lua;;";

    log_format datadog '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      '$request_time $upstream_response_time';

    log_format datadog_json escape=json
      '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"remote_user":"$remote_user",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"http_host":"$http_host",'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status"'
      '}';


    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    sendfile_max_chunk 6m;
    keepalive_timeout  65s;

    proxy_cache_path /tmp/shm/edge_cache levels=1:2 keys_zone=live_img_cache:10m inactive=60m max_size=1024m;
    # proxy_cache_path /tmp/shm/edge_cache levels=1:2 keys_zone=video_mp4_cache:100m inactive=120m max_size=1024m;

    access_log /var/log/nginx/access.log datadog;
    error_log  /var/log/nginx/error.log debug;

    upstream backend {
        server 127.0.0.1:8811;
    }

    map $http_origin $x_http_origin {
	    default $host;     # If Origin is blank, use $host
	    "~." $http_origin; # If Origin exists, use it
    }

    init_by_lua_block {
        local tags = require("metrics").build_tags()
        package.loaded.tags = tags
    }

    server {
        listen 81 reuseport backlog=1024;
        server_name _;

        location /nginx_status {
            stub_status;
            allow all;
        }
    }

    server {
        listen 80 reuseport backlog=4096;
        server_name _;

        location ~ ^/optimux/assets/(.*\.(mp3|wav|ogg|aac))$ {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Headers "Range, Content-Type, Authorization";
                add_header Access-Control-Allow-Methods "GET, OPTIONS";
                add_header Content-Length 0;
                return 204;
            }
            proxy_pass https://redernet-image-data.s3.us-east-1.amazonaws.com/stg/$1;
            proxy_set_header Host redernet-image-data.s3.us-east-1.amazonaws.com;
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;

            proxy_request_buffering off;
            proxy_buffering off;

            # proxy_cache video_mp4_cache;
            # proxy_cache_valid 200 206 302 60m;
            # proxy_cache_valid 404 1m;
            # proxy_cache_revalidate on;
            # proxy_cache_min_uses 1;
            # proxy_cache_use_stale error timeout updating;
            # proxy_cache_key "$scheme://$host$request_uri$is_args$args";

            add_header X-Cache-Status $upstream_cache_status;
            # add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Headers "Range, Content-Type" always;
            add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;
            add_header Accept-Ranges bytes always;
        }

        location /optimux {
                proxy_pass http://backend;
                expires 60m;

                access_by_lua_block {
                    local new_statsd = require("statsd")
                    local statsd, err = new_statsd({
                        host = "datadog-agent",
                        port = 8125,
                        namespace = "nginx",
                        nonblock = true
                    })
                    if err ~= nil then
                        ngx.log(ngx.ERR, "failed to connect to dd agent")
                        return
                    end

                    local tags = package.loaded.tags or {}
                    statsd:increment("optimux.requests.total", 1, 1, tags)
                }

                log_by_lua_block {
                    local new_statsd = require("statsd")
                    local statsd, err = new_statsd({
                        host = "datadog-agent",
                        port = 8125,
                        namespace = "nginx"
                    })

                    if err ~= nil then
                        ngx.log(ngx.ERR, "failed to connect to dd-agent")
                        return
                    end

                    ngx.log(ngx.INFO, "sending response "..ngx.status)

                    local status = ngx.status

                    local tags = package.loaded.tags or {}

                    if status >= 200 and status < 300 then
                        statsd:increment("optimux.responses.2xx", 1, 1, tags)
                    elseif status >= 300 and status < 400 then
                        statsd:increment("optimux.responses.3xx", 1, 1, tags)
                    elseif status >= 400 and status < 500 then
                        statsd:increment("optimux.responses.4xx", 1, 1, tags)
                    else
                        statsd:increment("optimux.responses.5xx", 1, 1, tags)
                    end

                    local cache_status = ngx.header["X-Cache-Status"] or ""
                    if #cache_status > 0 then
                        statsd:increment("optimux.nginx.cache."..cache_status, 1, 1, tags)
                    end

                    statsd:increment("optimux.responses.total", 1, 1, tags)
                }

                proxy_ignore_headers X-Accel-Expires Expires Cache-Control Set-Cookie;

		# proxy_set_header Host $host;

		proxy_set_header Origin $x_http_origin;

                proxy_cache live_img_cache;
                proxy_cache_valid 200 302 60m;
                proxy_cache_valid 404 1m;
                proxy_cache_revalidate on;
                proxy_cache_min_uses   1;
                proxy_cache_use_stale error timeout updating;
                proxy_cache_key "$scheme://$host$request_uri";

                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

                proxy_set_header X-Forwarded-Proto https;
                add_header Cache-Control "public, max-age=600, immutable";
                add_header Vary "Accept-Encoding";

                # add_header "Access-Control-Allow-Origin" "$host";
                # add_header "Access-Control-Allow-Methods" "GET, POST, OPTIONS, PUT, DELETE";
                # add_header "Access-Control-Allow-Headers" "Authorization, Content-Type, X-Requested-With, X-CSRF-Token, Content-Disposition";
                # add_header "Access-Control-Expose-Headers" "Content-Disposition, Content-Length, X-Request-Id";
                # add_header "Access-Control-Allow-Credentials" "true";

                add_header X-Cache-Status $upstream_cache_status;
                add_header X-XSS-Protection "1; mode=block";
                add_header X-Frame-Options SAMEORIGIN;
                add_header X-Content-Type-Options nosniff;
                add_header Last-Modified $date_gmt;

                proxy_request_buffering on;
                proxy_buffering on;
                chunked_transfer_encoding on;
        }

        location ~ /\. {
            deny all;
            access_log /var/log/nginx/invalid_requests.log;

            return 404;
        }
    }
}
